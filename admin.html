<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel • Fabíola & Junior</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fbf8f3;font-family:Arial;color:#39332f}.wrap{max-width:900px;margin:35px auto;padding:20px}.box{background:#fff;border:1px solid #e7ddd3;border-radius:18px;padding:25px}h1{font:34px Georgia;color:#66704a}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:9px}button{padding:11px 14px;border:0;border-radius:9px;background:#7d3040;color:#fff;cursor:pointer}.hide{display:none}.row{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #eee}.muted{color:#786e66;font-size:13px}</style></head><body><main class="wrap"><h1>Painel dos noivos</h1><div id="loginBox" class="box"><p>Entre com o usuário criado em Supabase → Authentication → Users.</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><p id="msg" class="muted"></p></div><div id="panel" class="box hide"><button onclick="logout()">Sair</button><h2>Reservas</h2><div id="rows">Carregando...</div></div></main><script>
const db=supabase.createClient("https://vcgdeabjnvwvajyuxbim.supabase.co","sb_publishable_obR47sylfIK8i19vofXxBg_jjp1YkPr");
async function login(){let r=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)msg.textContent=r.error.message;else show()}
async function show(){let r=await db.auth.getSession();if(!r.data.session)return;loginBox.classList.add("hide");panel.classList.remove("hide");load()}
async function load(){let r=await db.from("gifts").select("*").order("category").order("id");if(r.error)return rows.textContent=r.error.message;rows.innerHTML=r.data.map(x=>`<div class="row"><span><b>${x.name}</b><br><span class="muted">${x.category} • ${x.reserved_by?'reservado por '+esc(x.reserved_by):'disponível'}</span></span>${x.reserved_by?`<button onclick="release(${x.id})">Liberar</button>`:""}</div>`).join("")}
async function release(id){if(!confirm("Liberar este presente?"))return;let r=await db.from("gifts").update({reserved_by:null,reserved_at:null}).eq("id",id);if(r.error)alert(r.error.message);else load()}async function logout(){await db.auth.signOut();location.reload()}function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}show();
</script></body></html>
