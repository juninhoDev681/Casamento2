<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabíola & Junior • Lista de Presentes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--o:#66704a;--od:#4e5737;--m:#7d3040;--bg:#fbf8f3;--line:#e7ddd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#39332f;font-family:Arial}.hero{text-align:center;padding:65px 20px;background:linear-gradient(135deg,#e8eadc,#f8e8e7)}.monogram{font:18px Georgia;letter-spacing:4px;color:var(--m)}h1{font:46px Georgia;margin:10px;color:var(--od)}.hero p{max-width:650px;margin:auto;line-height:1.7;color:#786e66}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.search{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;font-size:16px}h2{font:29px Georgia;color:var(--m);border-bottom:1px solid var(--line);padding-bottom:9px;margin-top:35px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.gift{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 15px #00000008}.gift.taken{opacity:.55}.gift button{border:0;border-radius:9px;padding:10px 14px;background:var(--o);color:white}.gift button:disabled{background:#aaa}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:19px;padding:27px;max-width:440px;width:100%}.box h3{font:27px Georgia;color:var(--m)}.box input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;margin:15px 0;font-size:16px}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px;border:0;border-radius:10px}.cancel{background:#eee}.confirm{background:var(--m);color:#fff}.admin{text-align:center;display:block;margin:25px;color:var(--o)}footer{text-align:center;padding:40px;color:#786e66}@media(max-width:600px){h1{font-size:35px}.grid{grid-template-columns:1fr}}
</style></head><body><header class="hero"><div class="monogram">FABIOLA & JUNIOR</div><h1>Lista de Presentes</h1><p>Estamos começando uma nova história juntos, e você faz parte dela. Escolha com carinho um presente para o nosso novo lar. ♥</p></header>
<main class="wrap"><p><b>Escolha seu presente</b> • <span id="stats">Carregando...</span></p><input id="search" class="search" placeholder="🔎 Procurar um presente..." oninput="render()"><div id="list">Carregando...</div><a class="admin" href="admin.html">Área dos noivos</a></main><footer>Com carinho, Fabíola & Junior ♥</footer>
<div class="modal" id="modal"><div class="box"><h3>Confirmar escolha</h3><p id="selected"></p><input id="name" maxlength="100" placeholder="Seu nome completo"><div class="actions"><button class="cancel" onclick="closeModal()">Cancelar</button><button class="confirm" onclick="confirmGift()">Confirmar presente</button></div></div></div>
<script>
const db=supabase.createClient("https://vcgdeabjnvwvajyuxbim.supabase.co","sb_publishable_obR47sylfIK8i19vofXxBg_jjp1YkPr");let gifts=[],selected;
async function load(){let r=await db.from("gifts").select("*").order("id");if(r.error){list.textContent="Erro ao carregar. Execute supabase_setup.sql e confira as permissões.";return}gifts=r.data;render()}
function render(){let q=search.value.toLowerCase(),h="";[...new Set(gifts.map(x=>x.category))].forEach(c=>{let a=gifts.filter(x=>x.category==c&&x.name.toLowerCase().includes(q));if(!a.length)return;h+=`<section><h2>${c}</h2><div class="grid">`;a.forEach(x=>h+=`<div class="gift ${x.reserved_by?'taken':''}"><span>${x.name}</span><button ${x.reserved_by?'disabled':''} onclick="openM(${x.id})">${x.reserved_by?'Reservado':'Escolher'}</button></div>`);h+="</div></section>"});list.innerHTML=h||"Nenhum presente encontrado.";stats.textContent=`${gifts.filter(x=>!x.reserved_by).length} disponíveis • ${gifts.filter(x=>x.reserved_by).length} reservados`}
function openM(id){selected=gifts.find(x=>x.id==id);selectedText.textContent="Você escolheu: "+selected.name;name.value="";modal.classList.add("show");name.focus()}function closeModal(){modal.classList.remove("show")}
async function confirmGift(){let n=name.value.trim();if(!n)return alert("Informe seu nome.");let r=await db.rpc("reserve_gift",{p_gift_id:selected.id,p_name:n});if(r.error){alert((r.error.message||"").includes("PRESENT_ALREADY_RESERVED")?"Esse presente acabou de ser reservado por outra pessoa.":"Não foi possível reservar.");closeModal();return}closeModal();await load();alert("Presente reservado com sucesso! Obrigado, "+n+" ❤️")}
db.channel("gifts-realtime").on("postgres_changes",{event:"*",schema:"public",table:"gifts"},()=>load()).subscribe();load();
</script></body></html>
